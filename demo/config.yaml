# Select one model/config pair. Changing either value restarts the server on the
# next ./demo/run.sh invocation.
active:
  model: Ouro-2.6B-Thinking
  config: "1:2"

server:
  gpu: 2
  mem_fraction_static: 0.5
  random_seed: 1234

generation:
  max_new_tokens: 4096
  temperature: 0
  top_p: 1.0
  seed: 1234
  ignore_eos: false

# This catalog is the union of target models and baseline/LoopSpec configurations
# in experiments/*.yaml. Chat/thinking prompts are rendered by the server's
# tokenizer chat template before they enter the native streaming endpoint.
models:
  Ouro-1.4B:
    path: models/Ouro-1.4B
    chat: false
    configs:
      baseline: {mode: baseline}
      "1": {mode: loopspec, first: 1}
      "1:2":
        mode: loopspec
        first: 1
        second: 2

  Ouro-2.6B:
    path: models/Ouro-2.6B
    chat: false
    configs:
      baseline: {mode: baseline}
      "1": {mode: loopspec, first: 1}
      "1:2":
        mode: loopspec
        first: 1
        second: 2

  Ouro-1.4B-Thinking:
    path: models/Ouro-1.4B-Thinking
    chat: true
    enable_thinking: true
    configs:
      baseline: {mode: baseline}
      "1": {mode: loopspec, first: 1}
      "1:2":
        mode: loopspec
        first: 1
        second: 2

  Ouro-2.6B-Thinking:
    path: models/Ouro-2.6B-Thinking
    chat: true
    enable_thinking: true
    configs:
      baseline: {mode: baseline}
      "1": {mode: loopspec, first: 1}
      "1:2":
        mode: loopspec
        first: 1
        second: 2

  Recurrent-Llama-3.2-train-recurrence-32:
    path: models/Recurrent-Llama-3.2-train-recurrence-32
    chat: false
    configs:
      baseline: {mode: baseline}
      "2": {mode: loopspec, first: 2}
      "2:8": {mode: loopspec, first: 2, second: 8}
      "2:10": {mode: loopspec, first: 2, second: 10}
      "4": {mode: loopspec, first: 4}
      "4:8": {mode: loopspec, first: 4, second: 8}

  Recurrent-OLMo-2-0425-train-recurrence-32:
    path: models/Recurrent-OLMo-2-0425-train-recurrence-32
    chat: false
    configs:
      baseline: {mode: baseline}
      "2": {mode: loopspec, first: 2}
      "2:8": {mode: loopspec, first: 2, second: 8}
      "2:10": {mode: loopspec, first: 2, second: 10}
      "4": {mode: loopspec, first: 4}
      "4:8": {mode: loopspec, first: 4, second: 8}

  Recurrent-TinyLlama-3T-train-recurrence-32:
    path: models/Recurrent-TinyLlama-3T-train-recurrence-32
    chat: false
    configs:
      baseline: {mode: baseline}
      "2": {mode: loopspec, first: 2}
      "2:8": {mode: loopspec, first: 2, second: 8}
      "2:10": {mode: loopspec, first: 2, second: 10}
      "4": {mode: loopspec, first: 4}
      "4:8": {mode: loopspec, first: 4, second: 8}
